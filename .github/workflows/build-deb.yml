name: Build .deb Package

on:
  push:
    branches:
      - main

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pyqt5 python3-pip dpkg-dev fakeroot

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --windowed forono.py
          ls -lh dist/

      - name: Prepare DEB package
        run: |
          # Create directory structure
          mkdir -p package/DEBIAN
          mkdir -p package/usr/local/bin
          mkdir -p package/usr/share/icons/hicolor/256x256/apps
          mkdir -p package/usr/share/applications

          # Copy the PyInstaller binary
          cp dist/forono package/usr/local/bin/forono
          chmod 755 package/usr/local/bin/forono

          # Copy logo
          cp images/logo.jpg package/usr/share/icons/hicolor/256x256/apps/forono.jpg

          # Create desktop entry
          cat <<EOF > package/usr/share/applications/forono.desktop
          [Desktop Entry]
          Type=Application
          Name=Forono
          Exec=/usr/local/bin/forono
          Icon=/usr/share/icons/hicolor/256x256/apps/forono.jpg
          Terminal=false
          Categories=Utility;
          EOF

          # Control file
          cat <<EOF > package/DEBIAN/control
          Package: forono
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Ahmadreza Bashari <support@ahmadrezam.ir>
          Description: Shortcut Maker for Linux by Forono.
          EOF

      - name: Build DEB package
        run: |
          dpkg-deb --build package
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forono-deb
          path: package.deb
